# The checks every change to QR runs: on each pull request, and before each deploy (deploy.yml
# calls this first, so nothing goes live unless it passes). A green run means:
# - every language's page is what tools/pages.py writes from words/, with the same keys and
#   placeholders as English;
# - the HTML is valid;
# - Cloudflare would accept the deploy (a dry run that uploads nothing);
# - in desktop Chrome, Chrome on Android and Safari on iPhone: every code made is read back and
#   matches what was typed (the sticker, the PNG and the SVG); each mistake leaves what was typed
#   as it was; nothing typed leaves the page, even with Cloudflare's visit counter on it; it works
#   offline; every page loads cleanly, fits the screen and has no serious accessibility problems;
#   and every language follows the person (tests/).
# Pictures of every screen are kept with each run, as the "screens" artifact.
name: Checks
on:
  pull_request:
  workflow_call:
    inputs:
      outside-links:
        description: "fail, or warn: a deploy only warns about a broken link to another site"
        type: string
        default: fail
  workflow_dispatch:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: QR checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Every language's page is up to date
        working-directory: .
        run: python3 tools/pages.py --check
      - run: npm ci
      - name: The HTML is valid
        run: npm run html
      - name: Cloudflare would accept the deploy (dry run, uploads nothing)
        working-directory: .
        run: tests/node_modules/.bin/wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Browsers
        run: npx playwright install --with-deps chromium webkit
      - name: QR in three browsers
        run: npx playwright test
        env:
          CI: "true"
          OUTSIDE_LINKS: ${{ inputs.outside-links || 'fail' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: screens
          path: tests/screens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report
